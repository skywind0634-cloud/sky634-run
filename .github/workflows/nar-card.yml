name: nar-card
# 地方競馬の1レースの出馬表・オッズページを keiba.go.jp から取得し、nar-card ブランチに保存（手動）
on:
  workflow_dispatch:
    inputs:
      baba: {description: "競馬場コード（大井=20）", default: "20"}
      date: {description: "開催日 YYYY-MM-DD", required: true}
      race: {description: "レース番号", required: true}
permissions:
  contents: write
concurrency:
  group: nar-card
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests beautifulsoup4
      - run: python tools/nar_card.py ${{ inputs.baba }} ${{ inputs.date }} ${{ inputs.race }} /tmp/card/${{ inputs.baba }}/${{ inputs.date }}/${{ inputs.race }}
      - name: save
        run: |
          git config user.name "keiba-bot"
          git config user.email "keiba-bot@users.noreply.github.com"
          if git fetch -q origin nar-card; then git checkout -q -f -B nar-card origin/nar-card
          else git checkout -q --orphan nar-card; git rm -rq --cached . >/dev/null 2>&1 || true; fi
          mkdir -p card && cp -r /tmp/card/* card/
          git add card
          git commit -qm "card ${{ inputs.baba }} ${{ inputs.date }} ${{ inputs.race }}R $(date -u +%FT%H%M)" || exit 0
          git push -q origin HEAD:nar-card
