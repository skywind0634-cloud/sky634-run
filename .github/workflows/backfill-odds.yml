name: backfill-odds
# 過去レースの全馬の単勝オッズ（results.odds）を netkeiba のレース結果から埋める（バックテストを実オッズで行うため）
on:
  workflow_dispatch:
    inputs:
      budget: {description: "取得に使う分数", default: "300"}
      since: {description: "この日以降のレース", default: "2021-01-01"}
permissions:
  contents: write
concurrency:
  group: keiba-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m keiba.cli backfill-odds --since ${{ inputs.since }} --time-budget-min ${{ inputs.budget }}
      - name: commit
        run: |
          git config user.name "keiba-bot"
          git config user.email "keiba-bot@users.noreply.github.com"
          git add data/keiba.db
          git diff --cached --quiet || git commit -m "data: results.odds backfill"
          for i in 1 2 3 4; do git pull --rebase -X ours origin main && git push origin HEAD:main && break; sleep $((i*10)); done
