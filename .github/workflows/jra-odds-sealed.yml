name: jra-odds-sealed
# JRA のオッズのページ（POST の cname でたどる）を、オッズのトップから2段たどって取得し、渡された公開鍵で暗号化して sealed ブランチに保存（手動）。
# 海外競馬（ブリーダーズカップ等）の JRA オッズを取るため。keyword を含むページだけ残す。
on:
  workflow_dispatch:
    inputs:
      pubkey: {description: "暗号化用の公開鍵（PEM を base64）", required: true}
      keyword: {description: "残すページに含まれる語", default: "キーンランド"}
      tag: {description: "保存名", default: "jra-odds"}
      start: {description: "起点（path|cname）。海外は https://jra.jp/JRADB/accessSP.html|pk01pde01/5F", default: "/JRADB/accessO.html|pw15oli00/6D"}
      prefix: {description: "たどる cname の先頭", default: "pw15"}
permissions:
  contents: write
concurrency:
  group: fetch-sealed
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JRA_INTERVAL: "1.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: fetch
        env:
          KW: ${{ inputs.keyword }}
          START: ${{ inputs.start }}
          PREFIX: ${{ inputs.prefix }}
        run: |
          python3 - <<'PY'
          import os
          from keiba.scraper import jra
          os.makedirs("/tmp/p", exist_ok=True)
          kw = os.environ["KW"]
          sp, sc = os.environ["START"].split("|")
          pre = tuple(os.environ["PREFIX"].split(","))
          q, seen, n = [(sp, sc, 0)], set(), 0
          while q and n < 120:
              p, c, d = q.pop(0)
              if c in seen:
                  continue
              seen.add(c)
              try:
                  h = jra.post(p, c, use_cache=False)
              except Exception as e:
                  print("ERR", c, e); continue
              n += 1
              if kw in h:
                  open(f"/tmp/p/{len(os.listdir('/tmp/p')):03d}_{c.replace('/', '_')}.html", "w").write(h)
                  if d < 3:
                      q += [(pp, cc, d + 1) for pp, cc in jra.ACTION_RE.findall(h) if cc.startswith(pre) and cc not in seen]
          print(n, "pages,", len(os.listdir("/tmp/p")), "kept")
          PY
          tar czf /tmp/p.tgz -C /tmp p
          echo "${{ inputs.pubkey }}" | base64 -d > /tmp/pub.pem
          openssl rand -out /tmp/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/p.tgz -out /tmp/data.enc -pass file:/tmp/k.bin
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/key.enc
          rm -f /tmp/k.bin /tmp/p.tgz; rm -rf /tmp/p
      - name: save
        run: |
          git config user.name "keiba-bot"
          git config user.email "keiba-bot@users.noreply.github.com"
          for t in 1 2 3; do
            if git fetch -q origin sealed; then git checkout -q -f -B sealed origin/sealed
            else git checkout -q --orphan sealed; git rm -rq --cached . >/dev/null 2>&1 || true; fi
            mkdir -p sealed/${{ inputs.tag }} && cp /tmp/data.enc /tmp/key.enc sealed/${{ inputs.tag }}/
            git add sealed/${{ inputs.tag }}
            git commit -qm "sealed ${{ inputs.tag }}" || exit 0
            git push -q origin HEAD:sealed && break; sleep 5
          done
