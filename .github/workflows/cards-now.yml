name: cards-now
# 今週末の出馬表カードと予想だけを作る軽い処理（過去データの取り込みはしない）。
# 出馬表は木曜に土曜分、金曜に日曜分が JRA 公式に出る。前売りオッズは前日発売から増えていくので、
# 前日夜・当日朝にも作り直す（GitHub の定時実行は飛ばされることがあるため、時刻を複数用意）。
# 実績DB（keiba.db）は読むだけでコミットしない（取り込み処理と衝突しないよう別の順番待ち）。
on:
  schedule:
    - cron: "40 11 * * 4"   # 木 20:40 JST（土曜の出馬表）
    - cron: "40 11 * * 5"   # 金 20:40 JST（日曜の枠順・土曜の前売りオッズ）
    - cron: "40 14 * * 5"   # 金 23:40 JST（予備）
    - cron: "10 23 * * 5"   # 土 08:10 JST（土曜の当日オッズ・日曜の前売りオッズ）
    - cron: "40 11 * * 6"   # 土 20:40 JST（日曜の前売りオッズ）
    - cron: "10 23 * * 6"   # 日 08:10 JST（日曜の当日オッズ）
    - cron: "17 0 * * 6"    # 土 09:17 JST（予備: 土曜の当日オッズ）
    - cron: "17 13 * * 6"   # 土 22:17 JST（予備: 日曜の前売りオッズ）
    - cron: "17 0 * * 0"    # 日 09:17 JST（予備: 日曜の当日オッズ）
  workflow_dispatch:
    inputs:
      weekend:
        description: "土曜の日付 (YYYY-MM-DD, 空なら次の土曜)"
        default: ""
permissions:
  contents: write
concurrency:
  group: cards
  cancel-in-progress: false
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JRA_INTERVAL: "1.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: build cards (JRA)
        run: python -m keiba.cli build-cards --source jra ${{ inputs.weekend && format('--weekend {0}', inputs.weekend) || '' }}
      - name: predict
        continue-on-error: true
        run: python -m keiba.cli predict ${{ inputs.weekend && format('--weekend {0}', inputs.weekend) || '' }}
      - name: commit cards and predictions
        run: |
          git config user.name "keiba-bot"
          git config user.email "keiba-bot@users.noreply.github.com"
          git add cards predictions
          git diff --cached --quiet && exit 0
          git commit -qm "cards/predictions $(date -u +%F)"
          git checkout -- . && git clean -fdq data   # DB 等の未コミットの変更は捨てる（カード・予想だけを保存）
          ok=0
          for i in 1 2 3 4; do git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && ok=1 && break; sleep $((i*5)); done
          [ "$ok" = 1 ] || { echo "push failed"; exit 1; }
