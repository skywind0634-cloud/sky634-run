name: sakagami-ratings
# 坂上明大「重賞血統査定」（東スポ競馬）の各馬の適性・能力の★の数と、本文中の「血×条件」の件数（tools/trait_mining.py）を集める（本文は保存しない）。
# 裏付けの確認（tools/trait_check.py）→ data/knowledge/blood_traits.json・ped5_flags.json も更新。ratings ブランチの sakagami.json
on:
  schedule:
    - cron: "17 21 * * 4"   # 金曜 6:17 JST（月曜〜木曜に出る週末の重賞の回を拾う）
  workflow_dispatch:
    inputs:
      seeds: {description: "起点の記事ID（スペース区切り）", default: "76780 76700 76588 75861 76316 72013 70967 66645 56951 64304 60508 59299 57984 76210 68542 68309 67028"}
      limit: {description: "最大記事数", default: "250"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: collect
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.request, html
          UA = {"User-Agent": "Mozilla/5.0"}
          def get(u):
              try:
                  return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30).read().decode("utf-8", "ignore")
              except Exception as e:
                  print("ERR", u, e); return ""
          import os
          known = {}
          if os.path.exists("data/knowledge/sakagami_ratings.json"):
              known = {a["id"]: a for a in json.load(open("data/knowledge/sakagami_ratings.json"))}
          seeds = "${{ inputs.seeds }}".split() or []
          if not seeds:
              seeds = [str(int(max(known, key=int)) + k) for k in range(1, 400)] if known else ["76588"]
          queue = seeds; seen = set(); out = []
          while queue and len(seen) < int("${{ inputs.limit }}"):
              i = queue.pop(0)
              if i in seen:
                  continue
              seen.add(i)
              h = get(f"https://tospo-keiba.jp/sakagamiblood/{i}"); time.sleep(2)
              if not h:
                  continue
              # 本文は __NEXT_DATA__ などの JSON に \\uXXXX で埋め込まれていることがある → ほどく
              h = h.replace("\\/", "/")
              h = re.sub(r"\\u([0-9a-fA-F]{4})", lambda m: chr(int(m.group(1), 16)), h)
              h = h.replace("\\n", "\n").replace("\\u003c", "<").replace("\\u003e", ">").replace('\\"', '"')
              for x in re.findall(r"sakagamiblood/(\d+)", h):
                  if x not in seen:
                      queue.append(x)
              print(i, len(h), h.count("適性評価"), h.count("能力評価"), [m.start() for m in re.finditer("適性評価", h)][:3])
              k = h.find("適性評価")
              if k > 0 and i == "${{ inputs.seeds }}".split()[0]:
                  print("SAMPLE", repr(h[k - 300:k + 120]))
              title = html.unescape((re.search(r"<title>(.*?)</title>", h, re.S) or [None, ""])[1]).strip()
              # 血統の特徴（血×条件）を数えるための本文（ランナー内だけ。保存しない）
              os.makedirs("/tmp/sk", exist_ok=True)
              open(f"/tmp/sk/{i}.txt", "w").write(f"URL: https://tospo-keiba.jp/sakagamiblood/{i}\nTITLE: {title}\n\n"
                                                  + "\n".join(l.strip() for l in html.unescape(re.sub(r"<[^>]+>", "\n", h)).split("\n") if l.strip()))
              date = (re.search(r"(20\d\d)[/.-](\d\d?)[/.-](\d\d?)", h) or None)
              txt = html.unescape(re.sub(r"<[^>]+>", "\n", h))
              lines = [l.strip() for l in txt.split("\n") if l.strip()]
              horses, last = [], None
              for j, l in enumerate(lines):
                  m = re.match(r"適性評価[:：]\s*(★+)", l)
                  if m:
                      k = j - 1
                      name = None
                      while k >= 0 and k > j - 60:
                          if re.fullmatch(r"[ァ-ヴー・A-Za-z' ]{2,20}", lines[k]) and lines[k] not in ("Halo", "Wishing Well"):
                              name = lines[k]
                          if re.match(r"適性評価|能力評価", lines[k]):
                              break
                          k -= 1
                      ab = next((re.match(r"能力評価[:：]\s*(★+)", x).group(1) for x in lines[j + 1:j + 4] if re.match(r"能力評価[:：]\s*★", x)), "")
                      horses.append({"name": name, "fit": len(m.group(1)), "ability": len(ab)})
              out.append({"id": i, "title": title, "date": "-".join(date.groups()) if date else None, "horses": horses})
          for a in out:
              if a["horses"]:
                  known[a["id"]] = a
          out = sorted(known.values(), key=lambda a: int(a["id"]))
          json.dump(out, open("/tmp/sakagami.json", "w"), ensure_ascii=False, indent=1)
          print("saved", len(out), sum(len(a["horses"]) for a in out))
          PY
      - name: blood traits (血×条件)
        run: |
          git fetch -q origin ped-data && git show origin/ped-data:data/ped5_full.json > /tmp/ped5_full.json
          mkdir -p /tmp/skc
          [ -d /tmp/sk ] && python3 -I tools/sakagami_prep.py /tmp/sk /tmp/skc data/keiba.db || true
          python3 tools/trait_mining.py /tmp/ped5_full.json 坂上明大の血統査定 data/knowledge/claims_sakagami.json /tmp/skc
          python3 tools/trait_check.py /tmp/ped5_full.json data/knowledge/claims_mochida.json data/knowledge/claims_sakagami.json | head -3
          python3 tools/ped5_flags.py /tmp/ped5_full.json
          rm -rf /tmp/sk /tmp/skc
      - name: save to main (knowledge)
        run: |
          git config user.name "keiba-bot"
          git config user.email "keiba-bot@users.noreply.github.com"
          cp /tmp/sakagami.json data/knowledge/sakagami_ratings.json
          git add data/knowledge/sakagami_ratings.json data/knowledge/claims_sakagami.json data/knowledge/blood_traits.json data/knowledge/ped5_flags.json docs/analysis/blood_traits.md
          git commit -qm "坂上氏の★（★の数だけ）" || true
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: save
        run: |
          git config user.name "keiba-bot"
          git config user.email "keiba-bot@users.noreply.github.com"
          if git fetch -q origin ratings; then git checkout -q -f -B ratings origin/ratings
          else git checkout -q --orphan ratings; git rm -rq --cached . >/dev/null 2>&1 || true; fi
          cp /tmp/sakagami.json sakagami.json
          git add sakagami.json
          git commit -qm "sakagami ratings" || exit 0
          git push -q origin HEAD:ratings
